os:
  editPreset: 'nvim'
  # Drive Neovim through an RPC command (`nvr -c`) instead of key presses (`nvr --remote-send`):
  # sent keys land in whichever window has focus, so opening a file from a Lazygit that was started
  # from a `:terminal` tab used to type `:silent tabedit ...` into that shell instead of executing it.
  # `:LazygitEdit` is defined in neovimrc/lua/plugins/term.lua; it closes Lazygit and opens the file
  # in a new tab.  Lazygit quotes `{{filename}}` itself, hence the adjacent quoted words: the shell
  # concatenates them into a single `-c` argument.
  edit: nvr --nostart -c 'LazygitEdit '{{filename}}
  editAtLine: nvr --nostart -c 'LazygitEdit +'{{line}}' '{{filename}}
promptToReturnFromSubprocess: false
git:
  # Do not automatically fetch
  autoRefresh: false
  # Do not fetch all remotes
  fetchAll: false
  commit:
    autoWrapCommitMessage: false
    # autoWrapWidth: 80
  overrideGpg: false
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
  merging:
    # If true, run merges in a subprocess so that if a commit message is required, Lazygit will not hang.
    # Only applicable to unix users.
    manualCommit: true
gui:
  scrollHeight: 8
  scrollOffMargin: 10
  nerdFontsVersion: "3"  # enables icons
  filterMode: fuzzy
